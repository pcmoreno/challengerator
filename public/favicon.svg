  <rect x="21" y="43" width="22" height="19" rx="1.5" fill="#ff8b38"/>
  <!-- Podium: 3rd place (right) -->
  <rect x="45" y="54" width="17" height="8"  rx="1.5" fill="#16a34a"/>

  <!-- Car: rear wheel -->
