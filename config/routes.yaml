index:
    path: /
    controller: App\Controller\DefaultController::index

apitest:
    path: /apitest/
    controller: App\Controller\ApiController::apitest

challengeapitest:
    path: /challengeapitest/
    controller: App\Controller\ChallengeController::challengeApiTest

createDB:
    path: /couch/createdb/{dbName}/{code}
    controller: App\Controller\ApiController::createDb
    defaults:
        dbName: null
    methods: [get, put]

deleteDB:
    path: /couch/deletedb/{dbName}/{adminpass}
    controller: App\Controller\ApiController::deleteDb

listDBInfo:
    path: /couch/info/{dbName}
    controller: App\Controller\ApiController::databaseInfos
    defaults:
        dbName: null

getDocumentFromCouch:
    path: /couch/get/{dbName}/{id}
    controller: App\Controller\ApiController::fetchDocumentWithId

#updateDocumentFromCouch:
#    path: /couch/update/{dbName}/{id}
#    controller: App\Controller\ApiController::updateDocumentWithId

