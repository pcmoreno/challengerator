index:
    path: /
    controller: App\Controller\ChallengeController::index

# -----------------------------------------------
# Auth routes:
loginMenu:
    path: /login/{challengeName}
    controller: App\Controller\AuthController::loginFormPage

addSelfRegisteredVoterToChallengeFormPage:
    path: /challenge/signup/{challengeName}/{selfRegistrationCode}
    controller: App\Controller\AuthController::addSelfRegisteredVoterForChallengePage

changePasswordMenu:
    path: /voter/changePass
    controller: App\Controller\AuthController::changePasswordForVoter

# -----------------------------------------------
# Challenge routes:
listChallengesMenu:
    path: /challenges
    controller: App\Controller\ChallengeController::listChallengesMenu

createChallengeMenu:
    path: /challenge/new
    controller: App\Controller\ChallengeController::createChallenge

startChallenge:
    path: /challenge/initialize/{challengeName}/{token}
    controller: App\Controller\ChallengeController::startChallenge

addCarToChallengeFormPage:
    path: /challenge/addCarForm/{challengeName}/{token}
    controller: App\Controller\ChallengeController::carsDashboardPage

addVoterToChallengeFormPage:
    path: /challenge/addVoterForm/{challengeName}/{token}/{selfRegistrationCode}
    controller: App\Controller\ChallengeController::votersDashboardPage
    defaults:
        selfRegistrationCode: nope

toggleSelfRegistrationForChallenge:
    path: /challenge/toggleSelfRegistration/{challengeName}/{token}
    controller: App\Controller\ChallengeController::toggleSelfRegistrationForChallenge

resetVotesForVoterOnChallenge:
    path: /challenge/resetVoter/
    controller: App\Controller\ChallengeController::resetVotesForVoterOnChallenge
    methods: [ get ]

# -----------------------------------------------
# Voting routes:
voteDashboardForUser:
    path: /voteCarForUserDashboard/{challengeName}/{userId}/{token}
    controller: App\Controller\VotingController::votingDashBoardForUser

voteCarForUser:
    path: /voteCarForUser/{challengeName}/{userId}/{cars}/{result}/{token}
    controller: App\Controller\VotingController::voteForCarForUser

# -----------------------------------------------
# Upload routes:
listFile:
    path: /uploader/list/{folderId}
    controller: App\Controller\UploadController::listFilesFromGoogleDrive

uploadFile:
    path: /uploader/upload
    controller: App\Controller\UploadController::uploadFileToMyDriveForm

uploadFileToDrive:
    path: /uploader/uploaded
    controller: App\Controller\UploadController::uploadFileToDrive
